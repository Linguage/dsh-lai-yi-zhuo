name: Release DSH plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.3.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dsh-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const manifest = JSON.parse(readFileSync('package.json'))
          const lock = JSON.parse(readFileSync('package-lock.json'))
          assert.match(manifest.version, /^\d+\.\d+\.\d+$/)
          if (process.env.RELEASE_TAG) assert.equal(process.env.RELEASE_TAG, 'v' + manifest.version)
          assert.equal(lock.name, manifest.name)
          assert.equal(lock.version, manifest.version)
          assert.equal(lock.packages[''].name, manifest.name)
          assert.equal(lock.packages[''].version, manifest.version)
          JS
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Verify committed install files
        run: |
          changes="$(git status --porcelain -- lib web)"
          if [ -n "$changes" ]; then
            printf '%s\n' 'Run npm run build and commit the updated lib/ and web/ files.' "$changes"
            exit 1
          fi
      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 1
          fi
          notes="release-notes/${RELEASE_TAG}.md"
          gh release create "$RELEASE_TAG" dist/*.tgz dist/SHA256SUMS \
            --verify-tag --title "来一桌 $RELEASE_TAG" --notes-file "$notes"
